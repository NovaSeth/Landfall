# Standard class: a feature across store, formatting and command parsing, with a design choice to record.
# Harness graders are process indicators; completion (quality) is decided by the trusted post-pass.
# The case is JSON-formatted YAML so tests can parse it without a YAML library.
{
  "schema_version": "1.0",
  "name": "multi-file-feature",
  "description": "Multi-step work on a medium change: due dates touch three modules, date validation and a comparison against today, and the prompt asks for the storage choice to be recorded. Measured are hidden-test quality, verification, and whether the decision is recorded and reported.",
  "tags": [
    "standard",
    "feature",
    "decision",
    "process",
    "hidden-tests"
  ],
  "plugins": [
    "../.."
  ],
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "max_turns": 50,
    "timeout_seconds": 1200,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Edit",
      "Write",
      "Bash",
      "Skill",
      "Agent"
    ]
  },
  "runs": 5,
  "graders": [
    {
      "type": "tool_used",
      "name": "ran-tests",
      "tool": "Bash",
      "input_match": "node\\s+(--[\\w-]+\\s+)*--test|npm\\s+(run\\s+)?test\\b|npm\\s+t\\b",
      "min": 1
    },
    {
      "type": "regex",
      "name": "reports-decision",
      "target": "last_message",
      "pattern": "\\b(decid\\w*|decision|chose|chosen)\\b",
      "flags": "i",
      "match": "contains"
    },
    {
      "type": "regex",
      "name": "decision-record-file",
      "target": "files",
      "pattern": "(^|/)decisions?/[^/\\n]+$",
      "flags": "m",
      "match": "contains",
      "arm": "with-only"
    }
  ],
  "expected_outcome": "Both arms implement the flags. Hidden tests separate careful work (real calendar validation such as 2026-02-30, a task due today not counted as overdue, done tasks excluded, the flag before the title) from the happy path only. The with arm is expected to plan, verify and record the decision in its decision log (with-only indicator); the without arm may record it in the README or not at all."
}

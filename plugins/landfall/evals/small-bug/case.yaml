# Trivial class: a one-line bug with a failing test already in the repository.
# Harness graders are process indicators; completion (quality) is decided by the trusted post-pass.
# The case is JSON-formatted YAML so tests can parse it without a YAML library.
{
  "schema_version": "1.0",
  "name": "small-bug",
  "description": "Small bug fix guided by an existing failing test. Measures overhead on small work and whether the fix generalises beyond the one visible example (hidden edge cases).",
  "tags": [
    "trivial",
    "overhead",
    "bug-fix",
    "hidden-tests"
  ],
  "plugins": [
    "../.."
  ],
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "max_turns": 20,
    "timeout_seconds": 300,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Edit",
      "Write",
      "Bash",
      "Skill",
      "Agent"
    ]
  },
  "runs": 5,
  "graders": [
    {
      "type": "tool_used",
      "name": "few-shell-calls",
      "tool": "Bash",
      "min": 0,
      "max": 8
    },
    {
      "type": "tool_used",
      "name": "ran-tests",
      "tool": "Bash",
      "input_match": "node\\s+(--[\\w-]+\\s+)*--test|npm\\s+(run\\s+)?test\\b|npm\\s+t\\b",
      "min": 1
    }
  ],
  "expected_outcome": "Both arms fix the regular expression and see the suite pass. Hidden edge cases (runs of punctuation, trailing separators) separate a general fix from one that only satisfies the visible example; the with arm should not cost much more than the without arm."
}

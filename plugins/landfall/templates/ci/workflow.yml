# {{displayName}} gates in CI: the checks of the local task gate and the secrets scan, on every pull request and push
# to {{branch}}.
# Generated by `{{bin}} gen apply`. Edit freely: regeneration merges your edits (3-way); when an edit overlaps the
# new version, this file stays as it is and the new version is written next to it as <file>{{sideSuffix}}.
# Actions are pinned to a commit SHA; update them deliberately.
# Branch protection: require the single check "{{codename}} / result"; it collects every job.
name: "{{codename}}"
on:
  pull_request:
  push:
    branches: [{{branchYaml}}]
permissions:
  contents: read
concurrency:
  group: {{codename}}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  process:
    name: "{{codename}} / process"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
{{#hasPackage}}
          fetch-depth: 0 # the secrets scan reads every commit of a pull request
{{/hasPackage}}
      - name: no generated side file is tracked
        run: |
          side="$(git ls-files -- '*{{sideSuffix}}')"
          if [ -n "$side" ]; then
            echo "::error::generated side files (*{{sideSuffix}}) are tracked; merge each into its target, then git rm it"
            echo "$side"
            exit 1
          fi
{{#hasPackage}}
      - name: decision records are valid
        run: |
          npx --yes --package {{packageShell}} {{bin}} decisions check
      # A pull request: every commit it adds (also a secret added and removed again); a push: the tree. Exit 1 findings,
      # 8 the scan could not run; both fail the job.
      - name: secrets scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            npx --yes --package {{packageShell}} {{bin}} secrets --range "$BASE_SHA..$HEAD_SHA"
          else
            npx --yes --package {{packageShell}} {{bin}} secrets
          fi
{{/hasPackage}}
{{#hasGates}}
  gates:
    name: "{{codename}} / gates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
{{#gates}}
      - name: {{nameYaml}}
        run: |
          {{cmd}}
{{/gates}}
{{/hasGates}}
  result:
    name: "{{codename}} / result"
    needs: [process{{#hasGates}}, gates{{/hasGates}}]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
